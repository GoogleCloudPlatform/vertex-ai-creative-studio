options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_NAME: creative-studio/creative-studio:latest
steps:
  # Build the Docker image using the Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args: [ 'build', '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$_IMAGE_NAME', '.' ]
  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args: [ 'push', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$_IMAGE_NAME' ]
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Deploy'
    entrypoint: gcloud
    args: [ 'run', 'deploy', 'creative-studio', '--image', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$_IMAGE_NAME', '--region', '$LOCATION' ]
images:
- '$LOCATION-docker.pkg.dev/$PROJECT_ID/$_IMAGE_NAME'    
