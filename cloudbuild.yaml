options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_NAME: creative-studio/creative-studio:latest
  # Immutable per-build version tag (v<UTC-ts>-<shortSHA>), supplied by
  # deploy.sh/build.sh. When empty (e.g. a bare `gcloud builds submit`), only the
  # moving _IMAGE_NAME tag is pushed — identical to the pre-FU-3 behavior.
  _VERSION_TAG: ''
steps:
  # Inject Build Metadata for Versioning
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "{" > config/build.json
        echo "  \"commit\": \"$SHORT_SHA\"," >> config/build.json
        echo "  \"date\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" >> config/build.json
        echo "}" >> config/build.json

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build image'
    args: ['build', '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$_IMAGE_NAME', '.']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push image to Artifact Registry'
    args: ['push', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$_IMAGE_NAME']
  # Additionally tag+push the SAME built image under the immutable version tag
  # (build once; `docker tag`; push both refs -> same digest). Skipped when
  # _VERSION_TAG is empty, so the default (moving-tag-only) behavior is unchanged.
  # `$$VAR` escapes a shell variable so Cloud Build does not treat it as a
  # substitution; `$LOCATION`/`$PROJECT_ID`/`${_...}` are Cloud Build substitutions.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Tag and push immutable version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [ -z "${_VERSION_TAG}" ]; then
          echo "No _VERSION_TAG supplied; only the moving tag was pushed (default behavior)."
          exit 0
        fi
        MOVING="$LOCATION-docker.pkg.dev/$PROJECT_ID/${_IMAGE_NAME}"
        BASE="$${MOVING%:*}"
        VERSION_REF="$${BASE}:${_VERSION_TAG}"
        docker tag "$$MOVING" "$$VERSION_REF"
        docker push "$$VERSION_REF"
        echo "Pushed immutable version tag: $$VERSION_REF"
# NOTE (FU-5): this config BUILDS + PUSHES the image only; it deliberately does
# NOT run `gcloud run deploy`. Deployment is performed by the *caller* after the
# build (deploy/scripts/deploy.sh `do_deploy`, and build.sh), which deploys with
# the caller's own identity. Keeping deploy out of Cloud Build means the Cloud
# Build service account needs no roles/run.developer or act-as on the runtime SA
# (least privilege), and avoids a build failure when the default Cloud Build SA
# lacks those roles.    
